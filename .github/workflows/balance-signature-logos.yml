name: Balance signature logos

on:
  push:
    paths:
      - '.github/workflows/balance-signature-logos.yml'

permissions:
  contents: write

jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Balance logo widths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('generator.html')
          s=p.read_text()
          old='function logoRow(x){const w=x.mort?\'33.33%\':\'50%\';return `<table cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;width:100%;table-layout:fixed"><tr><td width="${w}" style="width:${w};text-align:center;vertical-align:middle;padding:6px 4px"><img src="${logos.cle}" style="display:block;width:100%;max-width:135px;height:auto;margin:0 auto" alt="Cliff Lewis Experience"></td><td width="${w}" style="width:${w};text-align:center;vertical-align:middle;padding:6px 4px"><img src="${logos.cb}" style="display:block;width:100%;max-width:135px;height:auto;margin:0 auto" alt="Coldwell Banker Hearthside"></td>${x.mort?`<td width="${w}" style="width:${w};text-align:center;vertical-align:middle;padding:6px 4px"><img src="${logos.blue}" style="display:block;width:100%;max-width:135px;height:auto;margin:0 auto" alt="Blue Sky Home Finance"></td>`:\'\'}</tr></table>`}'
          new='function logoRow(x){const w=x.mort?\'33.33%\':\'50%\';return `<table cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;width:100%;table-layout:fixed"><tr><td width="${w}" style="width:${w};text-align:center;vertical-align:middle;padding:8px 3px"><img src="${logos.cle}" width="150" style="display:block;width:150px;max-width:100%;height:auto;margin:0 auto" alt="Cliff Lewis Experience"></td><td width="${w}" style="width:${w};text-align:center;vertical-align:middle;padding:8px 3px"><img src="${logos.cb}" width="140" style="display:block;width:140px;max-width:100%;height:auto;margin:0 auto" alt="Coldwell Banker Hearthside"></td>${x.mort?`<td width="${w}" style="width:${w};text-align:center;vertical-align:middle;padding:8px 3px"><img src="${logos.blue}" width="150" style="display:block;width:150px;max-width:100%;height:auto;margin:0 auto" alt="Blue Sky Home Finance"></td>`:\'\'}</tr></table>`}'
          if old not in s:
              raise SystemExit('logoRow pattern not found')
          p.write_text(s.replace(old,new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generator.html
          git commit -m "Balance signature logo sizing"
          git push
