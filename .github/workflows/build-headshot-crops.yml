name: Prepare hosted headshot crops
on:
  pull_request:
    paths:
      - 'scripts/build_headshot_crops.py'
      - '.github/workflows/build-headshot-crops.yml'
permissions:
  contents: write
concurrency:
  group: prepare-crops-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/build_headshot_crops.py
      - name: Save prepared images
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git add headshot-crops
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'CLE Headshot Sync'
          git config user.email 'frontdesk@cliffmlewis.com'
          git commit -m 'Prepare hosted square headshot positions'
          git push origin "HEAD:$HEAD_BRANCH"
