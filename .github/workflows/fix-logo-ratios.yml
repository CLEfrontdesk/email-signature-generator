name: Fix signature logo ratios

on:
  push:
    paths:
      - '.github/workflows/fix-logo-ratios.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve horizontal logo aspect ratios
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('generator.html')
          s = p.read_text()
          s = s.replace('height="68" style="display:inline-block;height:68px;width:auto;max-width:100%"', 'style="display:block;width:100%;max-width:135px;height:auto;margin:0 auto"')
          s = s.replace('height="52" style="display:inline-block;height:52px;width:auto;max-width:100%"', 'style="display:block;width:100%;max-width:135px;height:auto;margin:0 auto"')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generator.html
          git diff --cached --quiet || git commit -m "Preserve horizontal logo aspect ratios"
          git push
