name: Install signature logos

on:
  push:
    paths:
      - 'logo-source/**'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode logo assets
        shell: bash
        run: |
          mkdir -p signature-assets
          base64 -d logo-source/cle-horizontal.b64 > signature-assets/cle-horizontal.png
          base64 -d logo-source/cbh-horizontal.b64 > signature-assets/cbh-horizontal.png
          base64 -d logo-source/bluesky-horizontal.b64 > signature-assets/bluesky-horizontal.png
      - name: Commit decoded logos
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signature-assets/*.png
          git diff --cached --quiet || git commit -m "Install horizontal signature logos"
          git push
